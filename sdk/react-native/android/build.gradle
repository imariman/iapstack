apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'com.iapstack.reactnative'
  compileSdkVersion rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
  defaultConfig { minSdkVersion 26 }
  sourceSets.main.java.srcDirs += ["../native/android/core", "../native/android/google-play", "../native/android/huawei"]
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}
repositories {
  google()
  mavenCentral()
  maven { url 'https://developer.huawei.com/repo/'; content { includeGroupByRegex 'com\\.huawei.*' } }
}
dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
  implementation 'com.android.billingclient:billing:8.3.0'
  implementation 'com.huawei.hms:iap:6.13.0.300'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'com.google.code.gson:gson:2.12.1'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
  testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
