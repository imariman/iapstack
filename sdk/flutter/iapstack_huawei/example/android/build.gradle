buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://developer.huawei.com/repo/" }
    }
    dependencies {
        // AG Connect's Gradle plugin still discovers the Android Gradle Plugin
        // version from the root buildscript classpath when no version catalog is
        // present. Keep this aligned with android/settings.gradle.
        classpath "com.android.tools.build:gradle:8.11.1"
        classpath "com.huawei.agconnect:agcp:1.9.6.300"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://developer.huawei.com/repo/" }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
