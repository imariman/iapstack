name: iapstack_huawei_example
description: Manual Huawei sandbox harness for the IAPStack Flutter SDK.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  iapstack:
    path: ../../iapstack
  iapstack_huawei:
    path: ..

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
