version: 0.1.0-dev.1
repository: https://github.com/imariman/iapstack/tree/main/sdk/flutter/iapstack_huawei
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
