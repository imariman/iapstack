    sdk: flutter
  huawei_iap: 6.14.0+300
  iapstack:
    path: ../iapstack

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.5.0
  lints: ^5.1.1

flutter:
  uses-material-design: false
