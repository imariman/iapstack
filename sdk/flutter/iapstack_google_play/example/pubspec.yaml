name: iapstack_google_play_example
description: Manual Google Play internal-testing harness for IAPStack.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  iapstack:
    path: ../../iapstack
  iapstack_google_play:
    path: ..

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/iapstack_test_broker_ca.pem
