name: iapstack_google_play
description: Google Play Billing companion for the provider-neutral IAPStack Flutter SDK.
version: 0.1.0-dev.1
repository: https://github.com/imariman/iapstack/tree/main/sdk/flutter/iapstack_google_play
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  iapstack:
    path: ../iapstack
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.2
  in_app_purchase_platform_interface: ^1.4.1
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: false
