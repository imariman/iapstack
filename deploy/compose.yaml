services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${IAPSTACK_POSTGRES_DB:-iapstack}
      POSTGRES_USER: ${IAPSTACK_POSTGRES_USER:-iapstack}
      POSTGRES_PASSWORD: ${IAPSTACK_POSTGRES_PASSWORD:?set IAPSTACK_POSTGRES_PASSWORD}
    ports:
      - "${IAPSTACK_POSTGRES_BIND_ADDRESS:-127.0.0.1}:${IAPSTACK_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - iapstack-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ..
    command: ["migrate"]
    environment:
      IAPSTACK_DATABASE_URL: host=postgres port=5432 user=${IAPSTACK_POSTGRES_USER:-iapstack} password=${IAPSTACK_POSTGRES_PASSWORD} dbname=${IAPSTACK_POSTGRES_DB:-iapstack} sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  api:
    build:
      context: ..
    command: ["api"]
    environment:
      IAPSTACK_DATABASE_URL: host=postgres port=5432 user=${IAPSTACK_POSTGRES_USER:-iapstack} password=${IAPSTACK_POSTGRES_PASSWORD} dbname=${IAPSTACK_POSTGRES_DB:-iapstack} sslmode=disable
      IAPSTACK_PROTECTION_ACTIVE_KEY_ID: ${IAPSTACK_PROTECTION_ACTIVE_KEY_ID:?set IAPSTACK_PROTECTION_ACTIVE_KEY_ID}
      IAPSTACK_PROTECTION_KEYS: ${IAPSTACK_PROTECTION_KEYS:?set IAPSTACK_PROTECTION_KEYS}
      IAPSTACK_PROTECTION_FINGERPRINT_KEY: ${IAPSTACK_PROTECTION_FINGERPRINT_KEY:?set IAPSTACK_PROTECTION_FINGERPRINT_KEY}
      IAPSTACK_BOOTSTRAP_ADMIN_KEY: ${IAPSTACK_BOOTSTRAP_ADMIN_KEY:-}
      IAPSTACK_METRICS_BEARER_TOKEN: ${IAPSTACK_METRICS_BEARER_TOKEN:?set IAPSTACK_METRICS_BEARER_TOKEN}
      IAPSTACK_ENVIRONMENT: ${IAPSTACK_ENVIRONMENT:-development}
      IAPSTACK_GRAFANA_OTLP_ENDPOINT: ${IAPSTACK_GRAFANA_OTLP_ENDPOINT:-}
      IAPSTACK_GRAFANA_OTLP_USERNAME: ${IAPSTACK_GRAFANA_OTLP_USERNAME:-}
      IAPSTACK_GRAFANA_OTLP_TOKEN: ${IAPSTACK_GRAFANA_OTLP_TOKEN:-}
      IAPSTACK_HUAWEI_ALLOW_PRIVATE_NETWORKS: ${IAPSTACK_HUAWEI_ALLOW_PRIVATE_NETWORKS:-false}
      IAPSTACK_WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${IAPSTACK_WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
      IAPSTACK_AUTH_MAX_CONCURRENT_DERIVATIONS: ${IAPSTACK_AUTH_MAX_CONCURRENT_DERIVATIONS:-4}
      IAPSTACK_HTTP_ADDRESS: :8080
    ports:
      - "${IAPSTACK_HTTP_BIND_ADDRESS:-127.0.0.1}:${IAPSTACK_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker:
    build:
      context: ..
    command: ["worker"]
    environment:
      IAPSTACK_DATABASE_URL: host=postgres port=5432 user=${IAPSTACK_POSTGRES_USER:-iapstack} password=${IAPSTACK_POSTGRES_PASSWORD} dbname=${IAPSTACK_POSTGRES_DB:-iapstack} sslmode=disable
      IAPSTACK_PROTECTION_ACTIVE_KEY_ID: ${IAPSTACK_PROTECTION_ACTIVE_KEY_ID:?set IAPSTACK_PROTECTION_ACTIVE_KEY_ID}
      IAPSTACK_PROTECTION_KEYS: ${IAPSTACK_PROTECTION_KEYS:?set IAPSTACK_PROTECTION_KEYS}
      IAPSTACK_PROTECTION_FINGERPRINT_KEY: ${IAPSTACK_PROTECTION_FINGERPRINT_KEY:?set IAPSTACK_PROTECTION_FINGERPRINT_KEY}
      IAPSTACK_METRICS_BEARER_TOKEN: ${IAPSTACK_METRICS_BEARER_TOKEN:?set IAPSTACK_METRICS_BEARER_TOKEN}
      IAPSTACK_ENVIRONMENT: ${IAPSTACK_ENVIRONMENT:-development}
      IAPSTACK_GRAFANA_OTLP_ENDPOINT: ${IAPSTACK_GRAFANA_OTLP_ENDPOINT:-}
      IAPSTACK_GRAFANA_OTLP_USERNAME: ${IAPSTACK_GRAFANA_OTLP_USERNAME:-}
      IAPSTACK_GRAFANA_OTLP_TOKEN: ${IAPSTACK_GRAFANA_OTLP_TOKEN:-}
      IAPSTACK_HUAWEI_ALLOW_PRIVATE_NETWORKS: ${IAPSTACK_HUAWEI_ALLOW_PRIVATE_NETWORKS:-false}
      IAPSTACK_WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${IAPSTACK_WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}
      IAPSTACK_WORKER_ID: ${IAPSTACK_WORKER_ID:-}
      IAPSTACK_WORKER_HTTP_ADDRESS: :8081
    expose:
      - "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  iapstack-postgres:
