services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${IAPSTACK_POSTGRES_DB:-iapstack}
      POSTGRES_USER: ${IAPSTACK_POSTGRES_USER:-iapstack}
      POSTGRES_PASSWORD: ${IAPSTACK_POSTGRES_PASSWORD:-iapstack}
    ports:
      - "${IAPSTACK_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - iapstack-postgres:/var/lib/postgresql/data

volumes:
  iapstack-postgres:
