services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${IAPSTACK_POSTGRES_DB:-iapstack}
      POSTGRES_USER: ${IAPSTACK_POSTGRES_USER:-iapstack}
      POSTGRES_PASSWORD: ${IAPSTACK_POSTGRES_PASSWORD:?set IAPSTACK_POSTGRES_PASSWORD}
    ports:
      - "${IAPSTACK_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - iapstack-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ..
    command: ["migrate"]
    environment: &iapstack-environment
      IAPSTACK_DATABASE_URL: postgres://${IAPSTACK_POSTGRES_USER:-iapstack}:${IAPSTACK_POSTGRES_PASSWORD}@postgres:5432/${IAPSTACK_POSTGRES_DB:-iapstack}?sslmode=disable
      IAPSTACK_PROTECTION_ACTIVE_KEY_ID: ${IAPSTACK_PROTECTION_ACTIVE_KEY_ID:?set IAPSTACK_PROTECTION_ACTIVE_KEY_ID}
      IAPSTACK_PROTECTION_KEYS: ${IAPSTACK_PROTECTION_KEYS:?set IAPSTACK_PROTECTION_KEYS}
      IAPSTACK_PROTECTION_FINGERPRINT_KEY: ${IAPSTACK_PROTECTION_FINGERPRINT_KEY:?set IAPSTACK_PROTECTION_FINGERPRINT_KEY}
      IAPSTACK_BOOTSTRAP_ADMIN_KEY: ${IAPSTACK_BOOTSTRAP_ADMIN_KEY:?set IAPSTACK_BOOTSTRAP_ADMIN_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  api:
    build:
      context: ..
    command: ["api"]
    environment:
      <<: *iapstack-environment
      IAPSTACK_HTTP_ADDRESS: :8080
    ports:
      - "${IAPSTACK_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker:
    build:
      context: ..
    command: ["worker"]
    environment:
      <<: *iapstack-environment
      IAPSTACK_WORKER_ID: ${IAPSTACK_WORKER_ID:-}
      IAPSTACK_WORKER_HTTP_ADDRESS: :8081
    expose:
      - "8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  iapstack-postgres:
