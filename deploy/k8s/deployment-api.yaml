# HTTP API and embedded dashboard. Single replica. Apply only after iapstack-migrate
# for this image digest has status Complete. No HorizontalPodAutoscaler is defined.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iapstack-api
  namespace: iapstack
  labels:
    app.kubernetes.io/name: iapstack
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iapstack
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iapstack
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace VERSION with the same immutable digest used by the migrate Job and the worker.
          image: ghcr.io/imariman/iapstack:VERSION
          # Kubernetes command replaces the image ENTRYPOINT (/usr/local/bin/iapstack).
          command: ["/usr/local/bin/iapstack"]
          args: ["api"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: IAPSTACK_HTTP_ADDRESS
              value: ":8080"
            - name: IAPSTACK_LOG_LEVEL
              value: info
            - name: IAPSTACK_WEBHOOK_ALLOW_PRIVATE_NETWORKS
              value: "false"
            - name: IAPSTACK_HUAWEI_ALLOW_PRIVATE_NETWORKS
              value: "false"
            # Required shape: sslmode=verify-full and sslrootcert=/etc/iapstack/postgres/ca.crt.
            # The operator supplies the PostgreSQL endpoint. Do not commit the value.
            - name: IAPSTACK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iapstack-secrets
                  key: IAPSTACK_DATABASE_URL
                  optional: false
            - name: IAPSTACK_PROTECTION_ACTIVE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: iapstack-secrets
                  key: IAPSTACK_PROTECTION_ACTIVE_KEY_ID
                  optional: false
            - name: IAPSTACK_PROTECTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: iapstack-secrets
                  key: IAPSTACK_PROTECTION_KEYS
                  optional: false
            - name: IAPSTACK_PROTECTION_FINGERPRINT_KEY
              valueFrom:
                secretKeyRef:
                  name: iapstack-secrets
                  key: IAPSTACK_PROTECTION_FINGERPRINT_KEY
                  optional: false
            - name: IAPSTACK_METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iapstack-secrets
                  key: IAPSTACK_METRICS_BEARER_TOKEN
                  optional: false
            # API-only, and only until a durable admin key exists. Remove the key, then restart.
            - name: IAPSTACK_BOOTSTRAP_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: iapstack-secrets
                  key: IAPSTACK_BOOTSTRAP_ADMIN_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /etc/iapstack/postgres
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: postgres-ca
          secret:
            secretName: iapstack-secrets
            defaultMode: 288 # 0440, readable by fsGroup 65532
            items:
              - key: postgres-ca.crt
                path: ca.crt
