name: iapstack
region: fra

envs:
  - key: IAPSTACK_DATABASE_URL
    scope: RUN_TIME
    type: SECRET
    value: ${iapstack-db.DATABASE_URL}
  - key: IAPSTACK_LOG_LEVEL
    scope: RUN_TIME
    value: info
  - key: IAPSTACK_PROTECTION_ACTIVE_KEY_ID
    scope: RUN_TIME
    value: primary
  - key: IAPSTACK_PROTECTION_KEY
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_WITH_BASE64_32_BYTE_KEY
  - key: IAPSTACK_PROTECTION_FINGERPRINT_KEY
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_WITH_SEPARATE_BASE64_32_BYTE_KEY
  - key: IAPSTACK_BOOTSTRAP_ADMIN_KEY
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES

services:
  - name: api
    github:
      repo: imariman/iapstack
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: /usr/local/bin/iapstack api
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /readyz
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 6

workers:
  - name: worker
    github:
      repo: imariman/iapstack
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: /usr/local/bin/iapstack worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

jobs:
  - name: migrate
    github:
      repo: imariman/iapstack
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: /usr/local/bin/iapstack migrate
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    kind: PRE_DEPLOY

databases:
  - name: iapstack-db
    engine: PG
    production: false

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
