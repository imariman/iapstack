services:
  - type: web
    name: iapstack-sandbox
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: server
    healthCheckPath: /readyz
    autoDeployTrigger: "off"
    envVars:
      - key: IAPSTACK_DATABASE_URL
        fromDatabase:
          name: iapstack-sandbox-postgres
          property: connectionString
      - key: IAPSTACK_BOOTSTRAP_ADMIN_KEY
        generateValue: true
      - key: IAPSTACK_GRAFANA_OTLP_ENDPOINT
        sync: false
      - key: IAPSTACK_GRAFANA_OTLP_USERNAME
        sync: false
      - key: IAPSTACK_GRAFANA_OTLP_TOKEN
        sync: false
      - fromGroup: iapstack-sandbox-runtime

databases:
  - name: iapstack-sandbox-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: iapstack
    user: iapstack
    ipAllowList: []

envVarGroups:
  - name: iapstack-sandbox-runtime
    envVars:
      - key: IAPSTACK_AUTO_MIGRATE
        value: "true"
      - key: IAPSTACK_ENVIRONMENT
        value: sandbox
      - key: IAPSTACK_METRICS_BEARER_TOKEN
        generateValue: true
      - key: IAPSTACK_PROTECTION_ACTIVE_KEY_ID
        value: primary
      - key: IAPSTACK_PROTECTION_KEY
        generateValue: true
      - key: IAPSTACK_PROTECTION_FINGERPRINT_KEY
        generateValue: true
      - key: IAPSTACK_WORKER_CONCURRENCY
        value: "1"
      - key: IAPSTACK_HUAWEI_ALLOW_PRIVATE_NETWORKS
        value: "false"
      - key: IAPSTACK_WEBHOOK_ALLOW_PRIVATE_NETWORKS
        value: "false"
      - key: IAPSTACK_LOG_LEVEL
        value: info
