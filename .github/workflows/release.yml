name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable, alpha, or release-candidate version to publish
        required: true
        default: v0.1.0-alpha.1
        type: string
      known_limitations:
        description: Public limitations note required for alpha releases
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: write
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-release

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release inputs
        env:
          KNOWN_LIMITATIONS: ${{ inputs.known_limitations }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "Version must be stable, alpha, or a numbered candidate such as v0.1.0, v0.1.0-alpha.1, or v0.1.0-rc.1."
            exit 1
          fi

          if [[ "$VERSION" == *-alpha.* ]]; then
            if [[ -z "${KNOWN_LIMITATIONS//[[:space:]]/}" ]]; then
              echo "Alpha releases require a public known-limitations note."
              exit 1
            fi
            if (( ${#KNOWN_LIMITATIONS} > 500 )); then
              echo "Alpha known-limitations note must not exceed 500 characters."
              exit 1
            fi

            release_channel="alpha"
            candidate="$GITHUB_SHA"
            candidate_ci="$(gh run list --workflow ci.yml --commit "$candidate" --event push --limit 1 --json headSha,status,conclusion,url)"
            test "$(jq -r 'length' <<<"$candidate_ci")" = "1"
            test "$(jq -r '.[0].headSha' <<<"$candidate_ci")" = "$candidate"
            test "$(jq -r '.[0].status' <<<"$candidate_ci")" = "completed"
            test "$(jq -r '.[0].conclusion' <<<"$candidate_ci")" = "success"
            candidate_ci_url="$(jq -r '.[0].url' <<<"$candidate_ci")"
          else
            if [[ "$VERSION" == *-rc.* ]]; then
              release_channel="candidate"
            else
              release_channel="stable"
            fi

            evidence_path="docs/releases/${VERSION}-release-evidence.json"
            test -s "$evidence_path"
            go run ./cmd/iapstack-release "$evidence_path"

            evidence_release="$(jq -r '.release' "$evidence_path")"
            candidate="$(jq -r '.commit' "$evidence_path")"
            test "$evidence_release" = "$VERSION"
            git cat-file -e "${candidate}^{commit}"
            git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"

            changed_files="$(git diff --name-only "$candidate" "$GITHUB_SHA")"
            if [[ "$changed_files" != "$evidence_path" ]]; then
              echo "Only the release evidence file may differ from the tested candidate."
              git diff --name-only "$candidate" "$GITHUB_SHA"
              exit 1
            fi

            candidate_ci_url="$(jq -r '.automated.ci_run_url' "$evidence_path")"
            candidate_run_id="${candidate_ci_url##*/}"
            if [[ ! "$candidate_run_id" =~ ^[0-9]+$ ]]; then
              echo "Evidence CI URL must end with a GitHub Actions run ID."
              exit 1
            fi
            candidate_ci="$(gh run view "$candidate_run_id" --json headSha,status,conclusion,url)"
            test "$(jq -r '.url' <<<"$candidate_ci")" = "$candidate_ci_url"
            test "$(jq -r '.headSha' <<<"$candidate_ci")" = "$candidate"
            test "$(jq -r '.status' <<<"$candidate_ci")" = "completed"
            test "$(jq -r '.conclusion' <<<"$candidate_ci")" = "success"

            head_ci="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion)"
            test "$(jq -r '.[0].status' <<<"$head_ci")" = "completed"
            test "$(jq -r '.[0].conclusion' <<<"$head_ci")" = "success"

            echo "EVIDENCE_PATH=$evidence_path" >> "$GITHUB_ENV"
          fi

          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists."
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 1
          fi

          echo "CANDIDATE=$candidate" >> "$GITHUB_ENV"
          echo "CANDIDATE_CI_URL=$candidate_ci_url" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$release_channel" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ !contains(inputs.version, '-') }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=IAPStack
            org.opencontainers.image.description=Self-hosted in-app purchase verification and entitlement infrastructure
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and publish multi-platform image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Prepare release notes
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          KNOWN_LIMITATIONS: ${{ inputs.known_limitations }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image_reference="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          notes_path="$RUNNER_TEMP/release-notes.md"

          # shellcheck disable=SC2016
          {
            printf '# IAPStack %s\n\n' "$VERSION"
            if [[ "$RELEASE_CHANNEL" == "alpha" ]]; then
              printf 'This alpha passed the automated release gates. It does not claim completion of the real-provider lifecycle gates required for a release candidate or stable release.\n\n'
              printf '## Known limitations\n\n%s\n\n' "$KNOWN_LIMITATIONS"
            else
              printf 'This release passed the automated and real-provider Apple App Store, Google Play, and Huawei AppGallery v0.1 gates.\n\n'
            fi
            printf '## Immutable inputs\n\n'
            printf -- '- Tested candidate: `%s`\n' "$CANDIDATE"
            printf -- '- Candidate CI: %s\n' "$CANDIDATE_CI_URL"
            if [[ "$RELEASE_CHANNEL" != "alpha" ]]; then
              printf -- '- Release evidence: `%s`\n' "$EVIDENCE_PATH"
            fi
            printf '\n'
            printf '## Container image\n\n'
            printf -- '- Version tag: `%s/%s:%s`\n' "$REGISTRY" "$IMAGE_NAME" "$VERSION"
            printf -- '- Immutable digest: `%s`\n\n' "$image_reference"
            printf 'Verify its GitHub build provenance with:\n\n'
            printf '```sh\n'
            printf 'gh attestation verify oci://%s -R %s\n' "$image_reference" "$GITHUB_REPOSITORY"
            printf '```\n'
          } > "$notes_path"

          echo "RELEASE_NOTES=$notes_path" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(
            --target "$GITHUB_SHA"
            --title "IAPStack $VERSION"
            --notes-file "$RELEASE_NOTES"
          )
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          if [[ "$RELEASE_CHANNEL" == "alpha" ]]; then
            gh release create "$VERSION" "${release_flags[@]}"
          else
            gh release create "$VERSION" \
              "$EVIDENCE_PATH#Three-provider release evidence" \
              "${release_flags[@]}"
          fi
