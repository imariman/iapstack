name: SDK package checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build and inspect SDK packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Check release validation and create npm archives
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          scripts/pack-sdk-npm.sh "$RUNNER_TEMP/sdk-packages"
      - name: Stage Maven artifacts without registry credentials
        working-directory: sdk/android
        run: >-
          ./gradlew --no-daemon
          :core:publishAllPublicationsToStagingRepository
          :google-play:publishAllPublicationsToStagingRepository
          :huawei:publishAllPublicationsToStagingRepository
      - name: Inspect Maven binaries, source jars, and dependencies
        run: python3 scripts/check-sdk-packages.py --maven-dir sdk/android/build/maven
      - name: Compile independent JVM and Android consumers
        run: scripts/check-sdk-android-consumer.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk-packages
          path: |
            ${{ runner.temp }}/sdk-packages/*.tgz
            sdk/android/build/maven/
          if-no-files-found: error
