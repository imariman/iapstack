name: React Native native checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-native-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: React Native ${{ matrix.platform }} build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            runner: ubuntu-latest
          - platform: iOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Prepare package and typecheck example
        working-directory: sdk/react-native
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run prepare:example
          cd example
          bun install --frozen-lockfile
          bun run typecheck
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.platform == 'Android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: matrix.platform == 'Android'
      - name: Build Android example without launching a device
        if: matrix.platform == 'Android'
        working-directory: sdk/react-native/example/android
        run: ./gradlew --no-daemon :iapstack_react-native:testDebugUnitTest :app:assembleDebug -PreactNativeArchitectures=arm64-v8a
      - name: Build iOS example without launching a device
        if: matrix.platform == 'iOS'
        working-directory: sdk/react-native/example/ios
        run: |
          pod install
          xcodebuild -workspace IAPStackExample.xcworkspace -scheme IAPStackExample \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/iapstack-rn-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Bundle example JavaScript for native runtime
        working-directory: sdk/react-native/example
        run: >-
          bunx react-native bundle --platform ${{ matrix.platform == 'iOS' && 'ios' || 'android' }}
          --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/iapstack-rn.jsbundle"
