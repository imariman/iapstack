name: Swift SDK checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-ios-sdk:
    name: Swift SDK checks
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show Swift version
        run: swift --version

      - name: Run Swift package tests
        run: swift test

      - name: Run runnable example flow tests
        working-directory: sdk/ios/example
        run: swift test

      - name: Build runnable iOS example without signing
        run: |
          xcodebuild \
            -project sdk/ios/example/IAPStackExample.xcodeproj \
            -scheme IAPStackExample \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/iapstack-ios-example" \
            CODE_SIGNING_ALLOWED=NO build
