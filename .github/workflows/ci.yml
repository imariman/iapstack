name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate tracked files
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD
          test -s README.md
          test -s LICENSE
          test -s assets/iapstack-gopher.png
          test -s dashboard/index.html
          test -s dashboard/app.css
          test -s contracts/openapi/v1.yaml
          test -s .github/workflows/release.yml
          node --check dashboard/app.js
          test -x deploy/e2e/run.sh

  go:
    name: Go checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: iapstack_test
          POSTGRES_USER: iapstack
          POSTGRES_PASSWORD: iapstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iapstack -d iapstack_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      IAPSTACK_TEST_DATABASE_URL: postgres://iapstack:iapstack@localhost:5432/iapstack_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect Go module
        id: module
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.module.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: steps.module.outputs.present == 'true'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Validate OpenAPI contract
        if: steps.module.outputs.present == 'true'
        run: go test -count=1 -run '^(TestOpenAPIContract.*|TestGoResponsesMatchOpenAPI)$' ./internal/transport/httpapi

      - name: Run go vet
        if: steps.module.outputs.present == 'true'
        run: go vet ./...

      - name: Run tests
        if: steps.module.outputs.present == 'true'
        run: go test -race -count=1 ./...

      - name: Report bootstrap state
        if: steps.module.outputs.present != 'true'
        run: echo "Go checks will activate automatically when go.mod is added."

  flutter-sdk:
    name: Flutter SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Check provider-neutral SDK
        working-directory: sdk/flutter/iapstack
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test

      - name: Check Huawei SDK
        working-directory: sdk/flutter/iapstack_huawei
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Check Huawei sandbox example
        working-directory: sdk/flutter/iapstack_huawei/example
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --debug --target-platform android-arm64

      - name: Reclaim Huawei Android build space
        if: always()
        working-directory: sdk/flutter/iapstack_huawei/example
        run: flutter clean

      - name: Check Google Play SDK
        working-directory: sdk/flutter/iapstack_google_play
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Check Google Play internal-testing example
        working-directory: sdk/flutter/iapstack_google_play/example
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --debug --target-platform android-arm64

      - name: Check Apple SDK
        working-directory: sdk/flutter/iapstack_apple
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

      - name: Check Apple StoreKit example
        working-directory: sdk/flutter/iapstack_apple/example
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

  flutter-ios:
    name: Flutter iOS build
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Build StoreKit testing harness
        working-directory: sdk/flutter/iapstack_apple/example
        run: |
          flutter pub get
          flutter build ios --simulator --debug

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: go

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag iapstack:ci .

  compose-e2e:
    name: Compose release gate
    runs-on: ubuntu-latest
    needs: container
    timeout-minutes: 15
    env:
      IAPSTACK_E2E_COMPOSE_PROJECT: iapstack-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run clean Compose release gate
        run: ./deploy/e2e/run.sh
