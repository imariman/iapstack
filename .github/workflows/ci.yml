name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate tracked files
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD
          test -s README.md
          test -s LICENSE
          test -s assets/iapstack-gopher.png
          test -s dashboard/index.html
          test -s dashboard/app.css
          test -s contracts/openapi/v1.yaml
          test -s .github/workflows/release.yml
          test -x .github/scripts/check-coverage.sh
          test -x .github/scripts/install-flutter.sh
          bash -n .github/scripts/check-coverage.sh
          test -x scripts/huawei-sandbox
          test -s scripts/huawei-sandbox.env.example
          test -s sdk/flutter/iapstack_huawei/example/android/key.properties.example
          bash -n scripts/huawei-sandbox
          scripts/huawei-sandbox --help >/dev/null
          git check-ignore -q scripts/huawei-sandbox.env
          git check-ignore -q sdk/flutter/iapstack_huawei/example/android/app/agconnect-services.json
          git check-ignore -q sdk/flutter/iapstack_huawei/example/android/key.properties
          node --check dashboard/app.js
          test -x deploy/e2e/run.sh
          for script in deploy/vps/install.sh deploy/vps/init-env.sh deploy/vps/backup.sh; do
            test -x "$script"
            sh -n "$script"
          done
          git check-ignore -q deploy/vps/.env
          test -s deploy/vps/offerings/README.md
          git check-ignore -q deploy/vps/offerings/example.json
          ruby -ryaml -e '
            c = YAML.safe_load_file("deploy/vps/compose.yaml", aliases: true)
            s = c.fetch("services").fetch("iapstack")
            abort("missing IAPSTACK_OFFERING_DIRECTORY") unless s.dig("environment", "IAPSTACK_OFFERING_DIRECTORY") == "/etc/iapstack/offerings"
            abort("missing offerings mount") unless Array(s["volumes"]).include?("./offerings:/etc/iapstack/offerings:ro")
          '
          test -x deploy/gcp/deploy.sh
          bash -n deploy/gcp/deploy.sh
          ruby -ryaml -e 'YAML.load_file("deploy/vps/cloud-init.yaml")'
          GOOGLE_CLOUD_PROJECT=ci IAPSTACK_DRY_RUN=1 bash deploy/gcp/deploy.sh >/dev/null

  go:
    name: Go checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: iapstack_test
          POSTGRES_USER: iapstack
          POSTGRES_PASSWORD: iapstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iapstack -d iapstack_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      IAPSTACK_TEST_DATABASE_URL: postgres://iapstack:iapstack@localhost:5432/iapstack_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect Go module
        id: module
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.module.outputs.present == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: steps.module.outputs.present == 'true'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Validate OpenAPI contract
        if: steps.module.outputs.present == 'true'
        run: go test -count=1 -run '^(TestOpenAPIContract.*|TestGoResponsesMatchOpenAPI)$' ./internal/transport/httpapi

      - name: Run go vet
        if: steps.module.outputs.present == 'true'
        run: go vet ./...

      - name: Run tests and enforce coverage
        if: steps.module.outputs.present == 'true'
        run: |
          go test -race -tags=integration -count=1 -coverprofile="$RUNNER_TEMP/go-coverage.out" ./...
          .github/scripts/check-coverage.sh go "$RUNNER_TEMP/go-coverage.out" 57 "Go statements"

      - name: Report bootstrap state
        if: steps.module.outputs.present != 'true'
        run: echo "Go checks will activate automatically when go.mod is added."

  flutter-sdk:
    name: Flutter SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Flutter SDK and packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ runner.arch }}-3.47.1

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Flutter
        env:
          FLUTTER_VERSION: 3.47.1
        run: .github/scripts/install-flutter.sh

      - name: Validate pub.dev archives
        run: scripts/publish-sdk-pub.sh --check

      - name: Check provider-neutral SDK
        working-directory: sdk/flutter/iapstack
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze
          flutter test --coverage
          "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" lcov coverage/lcov.info 84 "Provider-neutral SDK lines"

      - name: Check Huawei SDK
        working-directory: sdk/flutter/iapstack_huawei
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --coverage
          "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" lcov coverage/lcov.info 82 "Huawei SDK lines"

      - name: Check Huawei sandbox example
        working-directory: sdk/flutter/iapstack_huawei/example
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test --coverage
          "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" lcov coverage/lcov.info 62 "Huawei example lines"
          flutter build apk --debug --target-platform android-arm64

      - name: Reclaim Huawei Android build space
        if: always()
        working-directory: sdk/flutter/iapstack_huawei/example
        run: flutter clean

      - name: Check Google Play SDK
        working-directory: sdk/flutter/iapstack_google_play
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --coverage
          "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" lcov coverage/lcov.info 86 "Google Play SDK lines"

      - name: Check Google Play internal-testing example
        working-directory: sdk/flutter/iapstack_google_play/example
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test --coverage
          "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" lcov coverage/lcov.info 67 "Google Play example lines"
          flutter build apk --debug --target-platform android-arm64

      - name: Check Apple SDK
        working-directory: sdk/flutter/iapstack_apple
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --coverage
          "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" lcov coverage/lcov.info 79 "Apple SDK lines"

      - name: Check Apple StoreKit example
        working-directory: sdk/flutter/iapstack_apple/example
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test --coverage
          "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" lcov coverage/lcov.info 40 "Apple example lines"

  android-sdk:
    name: Android SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build native Android libraries and example, and run tests
        working-directory: sdk/android
        run: |
          ./gradlew --no-daemon :core:test :google-play:testDebugUnitTest :huawei:testDebugUnitTest :example:testDebugUnitTest :google-play:assembleRelease :huawei:assembleRelease :example:assembleDebug :google-play:lintDebug :huawei:lintDebug :example:lintDebug
          python3 -m unittest discover -s example/trusted-host -p 'test_*.py'
          git check-ignore -q example/store.properties
          git check-ignore -q example/agconnect-services.json
          git check-ignore -q example/upload.jks

  react-native-sdk:
    name: React Native SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Typecheck and test
        working-directory: sdk/react-native
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

  go-sdk:
    name: Go host SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: sdk/go/go.mod
          cache: true

      - name: Check formatting
        working-directory: sdk/go
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test
        working-directory: sdk/go
        run: |
          go vet ./...
          go test -race -count=1 -coverprofile="$RUNNER_TEMP/go-sdk-coverage.out" ./...
          "$GITHUB_WORKSPACE/.github/scripts/check-coverage.sh" go "$RUNNER_TEMP/go-sdk-coverage.out" 84 "Go host SDK statements"

  typescript-sdk:
    name: TypeScript host SDK checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Typecheck and test
        working-directory: sdk/typescript
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Build and import from plain Node
        working-directory: sdk/typescript
        # Self-referencing the package name resolves through the exports map,
        # so a missing or broken `import` condition fails this step.
        run: |
          bun run build
          node --input-type=module -e "
            import { Client } from '@iapstack/host';
            const client = new Client({ baseUrl: 'https://iap.example', applicationId: 'app', applicationToken: 'token' });
            if (Reflect.ownKeys(client).length !== 0) process.exit(1);
          "

  changes:
    name: Detect iOS-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether the Flutter iOS build must run
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Pushes to main and manual runs always build for real.
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The StoreKit harness compiles sdk/flutter/iapstack_apple, its
          # path dependency sdk/flutter/iapstack and pub.dev packages only; it
          # does not pull sdk/ios sources. sdk/ios stays listed as a safety net.
          pattern='^(sdk/flutter/|sdk/ios/|\.github/workflows/ci\.yml$|\.github/scripts/install-flutter\.sh$)'
          changed="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")"
          echo "Changed files:"
          echo "$changed"
          if grep -Eq "$pattern" <<< "$changed"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  flutter-ios:
    # This check name is required by the "Protect main" ruleset, so the job
    # must always report. When no iOS-relevant path changed it finishes on
    # ubuntu without touching a macOS runner. Anything other than an explicit
    # "false" (including a failed change detection) runs the real build.
    name: Flutter iOS build
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.ios == 'false' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 25
    env:
      IOS_BUILD: ${{ needs.changes.outputs.ios != 'false' }}

    steps:
      - name: Skip macOS build (no iOS-relevant changes)
        if: env.IOS_BUILD != 'true'
        run: echo "No Flutter or iOS paths changed; skipping the macOS StoreKit harness build."

      - name: Check out repository
        if: env.IOS_BUILD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Flutter SDK and packages
        if: env.IOS_BUILD == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ runner.arch }}-3.47.1

      - name: Set up Flutter
        if: env.IOS_BUILD == 'true'
        env:
          FLUTTER_VERSION: 3.47.1
        run: .github/scripts/install-flutter.sh

      - name: Build StoreKit testing harness
        if: env.IOS_BUILD == 'true'
        working-directory: sdk/flutter/iapstack_apple/example
        run: |
          flutter pub get
          flutter build ios --simulator --debug

  oracle-stack:
    name: Oracle Resource Manager stack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check formatting and validate
        shell: bash
        run: |
          terraform() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD/deploy/oracle:/stack" -w /stack hashicorp/terraform:1.9.8 "$@"
          }
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: go

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: |
          docker build --tag iapstack:ci \
            --build-arg IAPSTACK_VERSION=v0.0.0-ci.1 \
            --build-arg IAPSTACK_COMMIT="$GITHUB_SHA" .

      - name: Check the build stamp /readyz reports
        run: |
          # The linker ignores -X for a missing symbol, so check the stamped binary itself.
          docker run --rm --entrypoint /bin/grep iapstack:ci -q v0.0.0-ci.1 /usr/local/bin/iapstack
          docker run --rm --entrypoint /bin/grep iapstack:ci -q "$GITHUB_SHA" /usr/local/bin/iapstack
          # A build argument with whitespace would turn into extra linker flags.
          if docker build --build-arg IAPSTACK_VERSION="v1 -o /tmp/x" . >/dev/null 2>&1; then
            echo "Dockerfile accepted a build argument with whitespace" >&2
            exit 1
          fi

  compose-e2e:
    name: Compose release gate
    runs-on: ubuntu-latest
    needs: container
    timeout-minutes: 15
    env:
      IAPSTACK_E2E_COMPOSE_PROJECT: iapstack-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run clean Compose release gate
        run: ./deploy/e2e/run.sh
