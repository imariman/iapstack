name: SDK release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SDK prerelease version matching sdk/version.txt
        required: true
        default: 0.1.0-sdk.1
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish versioned SDK packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-release
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify immutable source and successful SDK checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/check-sdk-packages.py
          test "$VERSION" = "$(cat sdk/version.txt)"
          for workflow in ci.yml ios-spm-sdk.yml sdk-packages.yml react-native-native.yml; do
            result="$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --event push --limit 1 --json headSha,status,conclusion)"
            jq -e --arg sha "$GITHUB_SHA" 'length == 1 and .[0].headSha == $sha and .[0].status == "completed" and .[0].conclusion == "success"' <<< "$result"
          done
          for tag in "$VERSION" "sdk/go/v$VERSION"; do
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            fi
          done
          if release="$(gh release view "$VERSION" --json isDraft,targetCommitish 2>/dev/null)"; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' <<< "$release"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - name: Build and verify registry artifacts
        run: |
          scripts/pack-sdk-npm.sh "$RUNNER_TEMP/sdk-packages"
          (cd sdk/android && ./gradlew --no-daemon :core:publishAllPublicationsToStagingRepository :google-play:publishAllPublicationsToStagingRepository :huawei:publishAllPublicationsToStagingRepository)
          python3 scripts/check-sdk-packages.py --maven-dir sdk/android/build/maven
          scripts/check-sdk-android-consumer.sh
          (cd sdk/android/build/maven && zip -qr "$RUNNER_TEMP/sdk-packages/iapstack-maven.zip" .)
          (cd "$RUNNER_TEMP/sdk-packages" && sha256sum *.tgz *.zip > SHA256SUMS)
      - name: Publish npm packages with provenance
        # OIDC is preferred. NPM_TOKEN is only needed for initial package bootstrap
        # before @iapstack package trusted-publisher settings can be configured.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-sdk-npm.mjs "$RUNNER_TEMP/sdk-packages"
      - name: Publish Maven packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-sdk-maven.py
      - name: Create immutable Swift and Go SDK tags
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in "$VERSION" "sdk/go/v$VERSION"; do
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              git tag "$tag" "$GITHUB_SHA"
            fi
          done
          git push --atomic origin "refs/tags/$VERSION" "refs/tags/sdk/go/v$VERSION"
      - name: Verify Go public module resolution
        env:
          VERSION: ${{ inputs.version }}
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          for attempt in 1 2 3 4 5; do
            if go mod download "github.com/imariman/iapstack/sdk/go@v$VERSION"; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: '${{ runner.temp }}/sdk-packages/*'
      - name: Create SDK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          sha = os.environ['GITHUB_SHA']
          Path(os.environ['RUNNER_TEMP'], 'sdk-notes.md').write_text(
              f'IAPStack SDK {version}\n\n'
              'Prerelease SDK packages for HTTP API v1. This does not certify the server or replace its three-store release gate.\n\n'
              f'Source: `{sha}`\n\n'
              f'- npm: `@iapstack/host@{version}`, `@iapstack/react-native@{version}` (next channel)\n'
              f'- Go: `github.com/imariman/iapstack/sdk/go@v{version}`\n'
              f'- SwiftPM: repository root, exact version `{version}`\n'
              f'- Maven: `io.github.imariman.iapstack:iapstack-core|iapstack-google-play|iapstack-huawei:{version}` on GitHub Packages\n\n'
              'See docs/sdk-releases.md for installation, registry authentication and compatibility.\n'
          )
          PY
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --draft --verify-tag --target "$GITHUB_SHA" \
              --title "IAPStack SDK $VERSION" --prerelease --latest=false \
              --notes-file "$RUNNER_TEMP/sdk-notes.md"
          fi
          gh release upload "$VERSION" "$RUNNER_TEMP/sdk-packages/"* --clobber
          gh release download "$VERSION" --dir "$RUNNER_TEMP/sdk-download-check"
          for artifact in "$RUNNER_TEMP/sdk-packages/"*; do
            cmp "$artifact" "$RUNNER_TEMP/sdk-download-check/$(basename "$artifact")"
          done
          gh release edit "$VERSION" --draft=false --prerelease --latest=false
