name: Feature request
description: Propose an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user or operator problem first. IAPStack is prerelease, and proposed behavior may need to fit the documented v0.1 scope and security boundaries.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and API or workflow when relevant.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core domain or entitlements
        - Apple App Store
        - Google Play
        - Huawei AppGallery
        - HTTP API or OpenAPI contract
        - Dashboard
        - Flutter SDK
        - Deployment or operations
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive examples, compatibility constraints, or links.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues for similar requests.
          required: true
        - label: I reviewed the documented v0.1 scope and roadmap.
          required: true
