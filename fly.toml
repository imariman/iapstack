app = "replace-with-unique-iapstack-name"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  IAPSTACK_LOG_LEVEL = "info"
  IAPSTACK_PROTECTION_ACTIVE_KEY_ID = "primary"

[processes]
  api = "api"
  worker = "worker"

[deploy]
  release_command = "migrate"

[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[restart]]
  policy = "always"
  processes = ["worker"]
